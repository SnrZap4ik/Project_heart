<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Перевёрнутое сердце из I love you</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0d1a;
    overflow: hidden;
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById('heart');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Точки, образующие контур сердечка
function heartPoints(count) {
  const pts = [];
  for (let i = 0; i < count; i++) {
    const t = (i / count) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    pts.push({ x, y });
  }
  return pts;
}

const points = heartPoints(180);
const words = [];
const wordText = 'I love you';

points.forEach((p) => {
  words.push({
    baseX: p.x,
    baseY: p.y,
    x: p.x,
    y: p.y,
    offset: Math.random() * Math.PI * 2,
    speed: 0.5 + Math.random() * 0.8,
    size: 11 + Math.random() * 4,
    color: `hsl(${330 + Math.random() * 30}, 100%, ${55 + Math.random() * 20}%)`
  });
});

// Дополнительные слова внутри сердца
for (let i = 0; i < 70; i++) {
  const t = Math.random() * Math.PI * 2;
  const r = Math.random();
  const x = 16 * Math.pow(Math.sin(t), 3) * r;
  const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * r;
  words.push({
    baseX: x,
    baseY: y,
    x: x,
    y: y,
    offset: Math.random() * Math.PI * 2,
    speed: 0.5 + Math.random() * 1.2,
    size: 9 + Math.random() * 5,
    color: `hsl(${330 + Math.random() * 30}, 100%, ${50 + Math.random() * 25}%)`
  });
}

let time = 0;

function draw() {
  ctx.fillStyle = 'rgba(13, 13, 26, 0.25)';
  ctx.fillRect(0, 0, W, H);

  const scale = Math.min(W, H) / 55;
  const cx = W / 2;
  const cy = H / 2;

  const pulse = 1 + Math.sin(time * 0.05) * 0.06;

  const sorted = [...words].sort((a, b) => a.baseY - b.baseY);

  sorted.forEach(w => {
    w.x = w.baseX + Math.sin(time * 0.03 * w.speed + w.offset) * 0.8;
    w.y = w.baseY + Math.cos(time * 0.04 * w.speed + w.offset) * 0.8;

    const screenX = cx + w.x * scale * pulse;
    // Вот здесь переворачиваем: умножаем на -1
    const screenY = cy - w.y * scale * pulse;

    const alpha = 0.6 + 0.4 * Math.sin(time * 0.05 + w.offset);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = w.color;
    ctx.font = `bold ${w.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(wordText, screenX, screenY);
  });

  ctx.globalAlpha = 1;
  time++;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
